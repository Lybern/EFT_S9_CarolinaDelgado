# ===================================================================
# Configuración de Conexión a Base de Datos (MySQL / H2 Fallback)
# ===================================================================
# Si se tiene MySQL local, se conecta a la base backendIII.
# Si se desea H2 en memoria, puede usarse la variable de entorno o perfil.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/backendIII?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eri123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ===================================================================
# Configuración de Inicialización Spring Batch y DDL
# ===================================================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.sql.init.mode=always

# ===================================================================
# Rutas a los Archivos CSV de Entrada (Classpath / File)
# ===================================================================
app.batch.input-file=${APP_BATCH_INPUT_FILE:classpath:data/movimientos_financieros_diarios.csv}
app.batch.intereses-file=${APP_BATCH_INTERESES_FILE:classpath:data/intereses_trimestrales.csv}
app.batch.cuentas-anuales-file=${APP_BATCH_CUENTAS_ANUALES_FILE:classpath:data/estados_financieros_anuales.csv}

# ===================================================================
# Nivel de Trazabilidad y Logs
# ===================================================================
logging.level.com.bancoxyz.migracion=INFO
logging.level.org.springframework.batch=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n