# Configuración H2 para pruebas unitarias y de integración
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.sql.init.mode=always

app.batch.input-file=classpath:data/transacciones.csv
app.batch.intereses-file=classpath:data/intereses.csv
app.batch.cuentas-anuales-file=classpath:data/cuentas_anuales.csv
